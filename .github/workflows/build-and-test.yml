name: Build and Test

on:
  push:
    branches: [ master, main, feature/** ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mailtrap:
        image: dbck/mailtrap:latest
        ports:
          - 9080:80
          - 9025:25
          - 9143:143
        options: >-
          --health-cmd="bash -c '</dev/tcp/127.0.0.1/25'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore src/Agent.Tools.sln

    - name: Build
      run: dotnet build src/Agent.Tools.sln --configuration Release --no-restore

    - name: Run unit tests with coverage
      run: dotnet test src/Agent.Tools.sln --configuration Release --no-build --filter "Category!=Integration" --logger "trx;LogFileName=test-results-unit.trx" --collect:"XPlat Code Coverage" --results-directory=coverage

    - name: Run integration tests
      run: dotnet test src/Agent.Tools.sln --configuration Release --no-build --filter "Category=Integration" --logger "trx;LogFileName=test-results-integration.trx"
      continue-on-error: true

    - name: Generate coverage report
      if: always()
      uses: danielpalme/ReportGenerator-GitHub-Action@5.2.0
      with:
        reports: 'coverage/**/coverage.cobertura.xml'
        targetdir: 'coverage-report'
        title: 'Code Coverage Report'
        verbosity: 'Info'

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report/

    - name: Publish test results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: 'coverage/test-results-*.trx'
        check_name: 'Test Results'

    - name: Comment PR with coverage summary
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const reportPath = './coverage-report/index.html';
          if (fs.existsSync(reportPath)) {
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📊 Code coverage report available in [build artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            });
          }
