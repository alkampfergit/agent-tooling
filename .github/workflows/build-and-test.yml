name: Build and Test

on:
  push:
    branches: [ master, main, feature/** ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mailtrap:
        image: dbck/mailtrap:latest
        ports:
          - 9080:80
          - 9025:25
          - 9143:143
        options: >-
          --health-cmd="bash -c '</dev/tcp/127.0.0.1/25'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'zulu'

    - name: Cache SonarQube Cloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache SonarQube Cloud scanner
      id: cache-sonar-scanner
      uses: actions/cache@v4
      with:
        path: ./.sonar/scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner

    - name: Install SonarQube Cloud scanner
      if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
      run: |
        mkdir -p ./.sonar/scanner
        dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

    - name: Restore dependencies
      run: dotnet restore src/Agent.Tools.sln

    - name: Begin SonarQube Cloud analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        ./.sonar/scanner/dotnet-sonarscanner begin \
          /k:"alkampfergit_agent-tooling" \
          /o:"alkampfergit-github" \
          /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml"

    - name: Build
      run: dotnet build src/Agent.Tools.sln --configuration Release --no-restore

    - name: Run unit tests with coverage
      run: dotnet test src/Agent.Tools.sln --configuration Release --no-build --filter "Category!=Integration" --logger "trx;LogFileName=test-results-unit.trx" --collect:"XPlat Code Coverage;Format=opencover,cobertura" --results-directory=coverage

    - name: Run integration tests
      run: dotnet test src/Agent.Tools.sln --configuration Release --no-build --filter "Category=Integration" --logger "trx;LogFileName=test-results-integration.trx"
      continue-on-error: true

    - name: End SonarQube Cloud analysis
      if: always()
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: ./.sonar/scanner/dotnet-sonarscanner end

    - name: Generate coverage report
      if: always()
      uses: danielpalme/ReportGenerator-GitHub-Action@4d510cbed8a05af5aefea46c7fd6e05b95844c89 # 5.2.0
      with:
        reports: 'coverage/**/coverage.cobertura.xml'
        targetdir: 'coverage-report'
        title: 'Code Coverage Report'
        verbosity: 'Info'

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report/

    - name: Publish test results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
      with:
        files: 'coverage/test-results-*.trx'
        check_name: 'Test Results'

    - name: Comment PR with coverage summary
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const reportPath = './coverage-report/index.html';
          if (fs.existsSync(reportPath)) {
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📊 Code coverage report available in [build artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            });
          }
